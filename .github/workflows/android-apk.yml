name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies without postinstall
        run: npm install --ignore-scripts

      - name: Fix PermissionsService.kt and regenerate patch
        run: |
          node -e '
          const fs = require("fs");
          const target = "node_modules/expo-modules-core/android/src/main/java/expo/modules/adapters/react/permissions/PermissionsService.kt";
          if (!fs.existsSync(target)) {
            console.error("No existe:", target);
            process.exit(1);
          }
          let content = fs.readFileSync(target, "utf8");
          content = content.replace(/\r\n/g, "\n");
          if (!content.includes("grantResults.isNotEmpty()")) {
            content = content.replace(
              "grantResults[index] == PackageManager.PERMISSION_GRANTED",
              "index < grantResults.size && grantResults[index] == PackageManager.PERMISSION_GRANTED"
            );
          }
          fs.writeFileSync(target, content, "utf8");
          '
          rm -rf patches
          npx patch-package expo-modules-core

      - name: Ensure android project exists
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --non-interactive
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-in-one-fitness-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
